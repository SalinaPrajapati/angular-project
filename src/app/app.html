<a class="skip-link" href="#main" (click)="skipToMain($event)"
  >Skip to main content</a
>

<header class="site-header">
  <nav class="navbar navbar-expand-md navbar-dark bg-dark" aria-label="Main">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Merchant Applications</span>
      </a>

      @if (auth.user(); as user) {
        <button
          class="navbar-toggler"
          type="button"
          aria-controls="main-menu"
          aria-label="Toggle navigation"
          [attr.aria-expanded]="menuOpen()"
          (click)="menuOpen.set(!menuOpen())"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          id="main-menu"
          class="collapse navbar-collapse"
          [class.show]="menuOpen()"
        >
          <ul class="navbar-nav me-auto gap-md-1 ms-md-3">
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/applications"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                >Applications</a
              >
            </li>
            @if (user.role === 'sales') {
              <li class="nav-item">
                <a
                  class="nav-link"
                  routerLink="/applications/new"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                  >New application</a
                >
              </li>
            }
          </ul>

          <div
            class="d-flex flex-column flex-md-row align-items-md-center gap-3 py-3 py-md-0"
          >
            <div class="d-flex align-items-center gap-2">
              <span class="avatar" aria-hidden="true">{{
                initials(user.name)
              }}</span>
              <span class="text-white lh-sm">
                {{ user.name }}
                <span class="d-block small text-white-50">{{
                  roleLabels[user.role]
                }}</span>
              </span>
            </div>
            <button
              class="btn btn-outline-light btn-sm"
              type="button"
              (click)="signOut()"
            >
              Sign out
            </button>
          </div>
        </div>
      }
    </div>
  </nav>
</header>

<main id="main" tabindex="-1" #main>
  <router-outlet />
</main>
